PID: 3
Name: echo
Exit: 0

System Calls (total: 4)
  exit: 1
  write: 3 bytes: 7

Memory (total: 118784 bytes)
  TEXT: 2 pages
  DATA: 2 pages
  HEAP: 0 pages
  STACK: 25 pages

Page Tables (5 pages, 20480 bytes)
  L2: 1
  L1: 2
  L0: 2
"""
rubric = 20


