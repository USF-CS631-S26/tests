[project]
timeout = 120
subdir = "."


[[tests]]
name = "track-usage"
input = ["python3", "runoctox.py", "track"]
expected = """
$ track
usage: track <cmd> [args...]
"""
rubric = 5


[[tests]]
name = "track-echo"
input = ["python3", "runoctox.py", "track echo hello"]
expected = """
$ track echo hello
